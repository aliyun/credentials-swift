name: Swift coverage

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Run tests with coverage
        run: swift test --enable-code-coverage
      - name: Export coverage
        run: |
          xcrun llvm-cov export \
            .build/debug/AlibabaCloudCredentialsPackageTests.xctest/Contents/MacOS/AlibabaCloudCredentialsPackageTests \
            -instr-profile=.build/debug/codecov/default.profdata \
            -format=lcov Sources/AlibabaCloudCredentials/*.swift > coverage.lcov
      - name: Upload code coverage report
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          flags: swift
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: true
