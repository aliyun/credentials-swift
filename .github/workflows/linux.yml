name: Swift

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.9.0-jammy", "5.10.1-jammy", "6.0.3-jammy", "6.1.3-jammy", "6.2.4-jammy", "6.3.3-jammy", "6.4.0-jammy"]
    container:
      image: swift:${{ matrix.swift }}
      options: --cap-add=NET_ADMIN
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Tea for PR validation
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 9
        uses: actions/checkout@v4
        with:
          repository: aliyun/tea-swift
          ref: c121feb0b736c8b7afcea2e8acaafc47476a4d9a
          path: .swift-ci/tea-swift
          persist-credentials: false
      - name: Prepare unpublished Swift dependencies
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 9
        run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE"
      - name: Install network fixture prerequisite
        run: |
          apt-get update
          apt-get install -y --no-install-recommends iproute2
      - name: Run tests
        if: matrix.swift != '6.1.3-jammy'
        run: python3 .github/scripts/run-swift-tests.py swift test
      - name: Run tests with coverage
        if: matrix.swift == '6.1.3-jammy'
        run: python3 .github/scripts/run-swift-tests.py swift test --enable-code-coverage
      - name: Export coverage
        if: matrix.swift == '6.1.3-jammy'
        run: |
          llvm-cov export .build/debug/AlibabaCloudCredentialsPackageTests.xctest \
            -instr-profile=.build/debug/codecov/default.profdata \
            -format=lcov Sources/AlibabaCloudCredentials/*.swift > coverage.lcov
      - name: Upload code coverage report
        if: matrix.swift == '6.1.3-jammy'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          flags: swift
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check coverage
        if: matrix.swift == '6.1.3-jammy'
        run: python3 .github/scripts/check-swift-coverage.py "$(swift test --show-codecov-path)"

  macos:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Use each Xcode's bundled compiler and SDK together.
          - os: macos-14
            xcode_select: /Applications/Xcode_15.0.1.app/Contents/Developer
            name: Swift 5.9 (Xcode 15.0.1) on macos-14
          - os: macos-14
            xcode_select: /Applications/Xcode_15.3.app/Contents/Developer
            name: Swift 5.10 (Xcode 15.3) on macos-14
          - os: macos-15
            xcode_select: /Applications/Xcode_16.app/Contents/Developer
            name: Swift 6.0 (Xcode 16.0) on macos-15
          - os: macos-15
            xcode_select: /Applications/Xcode_16.4.app/Contents/Developer
            name: Swift 6.1 (Xcode 16.4) on macos-15
          - os: macos-15
            xcode_select: /Applications/Xcode_26.0.1.app/Contents/Developer
            name: Swift 6.2 (Xcode 26.0.1) on macos-15
          - os: macos-26
            xcode_select: /Applications/Xcode_26.6.app/Contents/Developer
            name: Swift 6.3 (Xcode 26.6) on macos-26
          - os: xcode-27
            xcode_select: /Applications/Xcode_27.app/Contents/Developer
            name: Swift 6.4 (Xcode 27.0) on xcode-27
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Tea for PR validation
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 9
        uses: actions/checkout@v4
        with:
          repository: aliyun/tea-swift
          ref: c121feb0b736c8b7afcea2e8acaafc47476a4d9a
          path: .swift-ci/tea-swift
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "${{ matrix.xcode_select }}"
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Prepare unpublished Swift dependencies
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 9
        run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE"
      - name: Run tests
        run: swift test
