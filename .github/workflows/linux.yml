name: Linux

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['5.10', '6.1']
    container: swift:${{ matrix.swift }}-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Tea for PR validation
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 9
        uses: actions/checkout@v4
        with:
          repository: aliyun/tea-swift
          ref: e761d83701ef3887c3ac5e1deabd21af1999fd44
          path: .swift-ci/tea-swift
          persist-credentials: false
      - name: Prepare unpublished Swift dependencies
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 9
        run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE"
      - run: swift test
